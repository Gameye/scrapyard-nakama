name: scrapyard-node
data_dir: "/nakama/data"

console:
  port: 7351

socket:
  server_key: "defaultkey"

session:
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 2592000 # 30 days: a www login lasts between visits (Nakama's default, 1 h, is shorter than the token)
  single_socket: true # one socket a player: the Gameye match notification goes to one page, and a matchmaker ticket dies with its socket

# Gameye matches (modules-src): a pair can match at its minimum within about
# 10 s (5 intervals of 2 s), before the page's 12 s solo timer fires.
matchmaker:
  interval_sec: 2
  max_intervals: 5

runtime:
  path: "/nakama/data/modules"
  # The Gameye plugin (gameye.so, built from modules-src/) reads its settings
  # from runtime.env: GAMEYE_API_TOKEN, GAMEYE_API_IMAGE,
  # GAMEYE_API_IMAGE_VERSION, GAMEYE_API_REGION, RELAY_SECRET and RELAY_URL,
  # optionally GAMEYE_API_URL, GAMEYE_API_TTL and GAMEYE_API_PORT. They hold
  # secrets: never put them here. Pass them with --runtime.env flags or a
  # second, uncommitted --config file (see modules-src in nakama/AGENTS.md).
