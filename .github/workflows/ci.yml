# Checks for every pull request and every push to main: the game (and the
# Gameye entry as a process, with the relay's tests: the root npm test), the
# Nakama plugin and the site. release.yml runs them too, before it publishes.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# pull requests from forks run untrusted code: the token only reads
permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # the self-checks run .ts files directly
          cache: npm
          cache-dependency-path: |
            game/package-lock.json
            package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # tsc -b, then vite build
      - run: npm run check # builds dist-server/ too
      # the relay (edge/) and the Gameye entry, game/dist-server/gameye-main.js, as a process
      - run: npm ci
        working-directory: .
      - run: npm test
        working-directory: .

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nakama/modules-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TODO: remove with the replace in go.mod once github.com/Gameye/nakama-fleetmanager v0.1.0 is published
      - name: The Fleet Manager comes from a published module
        run: |
          if grep -q '^replace github.com/Gameye/nakama-fleetmanager' go.mod; then
            echo "::error file=nakama/modules-src/go.mod::go.mod still replaces github.com/Gameye/nakama-fleetmanager with a local checkout, which CI doesn't have. Publish nakama-fleetmanager v0.1.0, require it and drop the replace (and the mount in build.sh, the build context in nakama/Dockerfile)."
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: nakama/modules-src/go.mod # Nakama 3.41's Go
          cache-dependency-path: nakama/modules-src/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  www:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build # typechecks too
