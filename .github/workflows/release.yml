# One release from one commit (KTD11): once every check in ci.yml passes on a
# push to main, publish
#   ghcr.io/<owner>/scrapyard-nakama:sha-<commit>          the game server (Dockerfile), what Gameye runs
#   ghcr.io/<owner>/scrapyard-nakama-backend:sha-<commit>  Nakama with the plugin baked in (nakama/Dockerfile)
#   the artifact site-sha-<commit>                         www/dist with the game at /play in Gameye mode,
#                                                          and release.json (commit, build id, both images)
# all from the same commit, so the page's build id is the game server's. The
# deploy registers the game image's tag on Gameye, waits until
# /tag/{region}/{image}/{version} says it exists, then swaps the site and
# Nakama's GAMEYE_API_IMAGE_VERSION together.
#
# After the first run, make both packages public in the packages' settings:
# Gameye pulls the game server image anonymously.
#
# The site bundle needs repository settings (no bundle without them):
#   variables: SITE_DOMAIN, API_DOMAIN (Nakama's TLS host)
#   secrets:   NAKAMA_CLIENT_KEY (Nakama's socket.server_key: built into the bundle, so not secret; a secret keeps it out of logs)
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to this repository owner's GHCR
    env:
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO: remove with the replace in go.mod once github.com/Gameye/nakama-fleetmanager v0.1.0 is published.
      # Until then nakama/Dockerfile needs the checkout as a build context, which CI doesn't have.
      - name: The Fleet Manager comes from a published module
        run: |
          if grep -q '^replace github.com/Gameye/nakama-fleetmanager' nakama/modules-src/go.mod; then
            echo "::error file=nakama/modules-src/go.mod::go.mod still replaces github.com/Gameye/nakama-fleetmanager with a local checkout: the Nakama image can't be built here. Publish nakama-fleetmanager v0.1.0, require it and drop the replace."
            exit 1
          fi

      # GHCR names are lowercase; the owner's may not be
      - name: Image names
        id: names
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "game=ghcr.io/$owner/scrapyard-nakama:$TAG"
            echo "backend=ghcr.io/$owner/scrapyard-nakama-backend:$TAG"
            echo "created=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Both images are built before either is pushed: a failed build publishes nothing.
      - name: Build the game server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
      - name: Build the Nakama image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: nakama/Dockerfile
          platforms: linux/amd64
          push: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the same builds again, from the builder's cache, pushed
      - name: Push the game server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.game }}
          labels: |
            org.opencontainers.image.title=scrapyard-nakama
            org.opencontainers.image.description=Scrapyard's game server, one match per Gameye session
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.created=${{ steps.names.outputs.created }}
            org.opencontainers.image.licenses=MIT
      - name: Push the Nakama image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: nakama/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.backend }}
          labels: |
            org.opencontainers.image.title=scrapyard-nakama-backend
            org.opencontainers.image.description=Nakama 3.41 with Scrapyard's Gameye plugin, Lua modules and config
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.created=${{ steps.names.outputs.created }}
            org.opencontainers.image.licenses=MIT

  site:
    # after the images: release.json names them, so it's uploaded only once both are pushed
    needs: [ci, images]
    if: vars.SITE_DOMAIN != '' && vars.API_DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            game/package-lock.json
            www/package-lock.json

      # Nakama's address and client key go into both bundles at build time; the game's online play is Gameye mode
      - name: Build
        env:
          SITE_URL: https://${{ vars.SITE_DOMAIN }}
          VITE_MATCHMAKER: gameye
          VITE_NAKAMA_HOST: ${{ vars.API_DOMAIN }}
          VITE_NAKAMA_PORT: 443
          VITE_NAKAMA_SSL: true
          VITE_NAKAMA_KEY: ${{ secrets.NAKAMA_CLIENT_KEY }}
          PUBLIC_NAKAMA_HOST: ${{ vars.API_DOMAIN }}
          PUBLIC_NAKAMA_PORT: 443
          PUBLIC_NAKAMA_SSL: true
          PUBLIC_NAKAMA_KEY: ${{ secrets.NAKAMA_CLIENT_KEY }}
        run: |
          (cd game && npm ci)
          (cd www && npm ci)
          scripts/build.sh
          npm --prefix www run check

      # what the deploy needs to keep the three in step
      - name: Release manifest
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          build=$(cd game && node --input-type=module -e "import { buildId } from './build-id.ts'; console.log(buildId())")
          node -e 'console.log(JSON.stringify({ commit: process.argv[1], tag: process.argv[2], build: process.argv[3], game: process.argv[4], nakama: process.argv[5] }, null, 2))' \
            "$GITHUB_SHA" "$TAG" "$build" "ghcr.io/$owner/scrapyard-nakama:$TAG" "ghcr.io/$owner/scrapyard-nakama-backend:$TAG" > release.json
          cat release.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ env.TAG }}
          path: |
            www/dist/
            release.json
          if-no-files-found: error
